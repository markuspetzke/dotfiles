# Font
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
disable_ligatures never
shell_integration enabled

# Window (opacity/blur are handled by Hyprland through the kitty window rule)
window_padding_width 8
confirm_os_window_close 0
hide_window_decorations yes
enable_audio_bell no
visual_bell_duration 0
inactive_text_alpha 0.86

# Cursor

# Scrollback: Ctrl+Shift+H opens the history in Neovim
scrollback_lines 10000
scrollback_pager nvim -u NONE -c 'setlocal ft=sh nonumber norelativenumber nolist' -c 'silent! %s/\e\[[0-9;?]*[a-zA-Z]//g' -c 'normal! G' -

# Tabs
tab_bar_style separator
tab_separator " │ "
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 4
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_title_template {index}: {title}

# Colors and cursor come from the active theme (themes/<name>/kitty.conf, `theme <name>`).
include ../theme-current/kitty.conf
