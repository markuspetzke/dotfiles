# Font
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
disable_ligatures never
shell_integration enabled

# Fenster (Opacity/Blur regelt Hyprland ueber die kitty-Window-Rule)
window_padding_width 8
confirm_os_window_close 0
hide_window_decorations yes
enable_audio_bell no
visual_bell_duration 0
inactive_text_alpha 0.86

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback: Ctrl+Shift+H oeffnet den Verlauf in Neovim
scrollback_lines 10000
scrollback_pager nvim -u NONE -c 'setlocal ft=sh nonumber norelativenumber nolist' -c 'silent! %s/\e\[[0-9;?]*[a-zA-Z]//g' -c 'normal! G' -

# Tabs
tab_bar_style separator
tab_separator " │ "
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 4
tab_bar_margin_color #141310
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_title_template {index}: {title}

# Colors -- Bernstein-CRT (passend zu Hyprland/waybar/Neovim)
background #1b1a16
foreground #e6dcc3
selection_background #4a3a1e
selection_foreground #f4ecd8
url_color #5fa8a3
cursor #e8a33d
cursor_text_color #1b1a16

active_tab_background #e8a33d
active_tab_foreground #141310
inactive_tab_background #2a2822
inactive_tab_foreground #8a8370
tab_bar_background #141310

active_border_color #e8a33d
inactive_border_color #36332b

# 16 Farben: warm gedeckt, Gelb = Bernstein
color0  #141310
color1  #c8553d
color2  #8f9a5b
color3  #e8a33d
color4  #5f87a3
color5  #a3768a
color6  #5fa8a3
color7  #c9bfa6
color8  #4a463b
color9  #e06a4f
color10 #a9b56c
color11 #f2bb5c
color12 #7aa3bf
