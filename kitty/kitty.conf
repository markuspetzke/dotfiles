# Font
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
disable_ligatures never
shell_integration enabled

# Fenster (Opacity/Blur regelt Hyprland ueber die kitty-Window-Rule)
window_padding_width 8
confirm_os_window_close 0
hide_window_decorations yes
enable_audio_bell no
visual_bell_duration 0
inactive_text_alpha 0.86

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrollback: Ctrl+Shift+H oeffnet den Verlauf in Neovim
scrollback_lines 10000
scrollback_pager nvim -u NONE -c 'setlocal ft=sh nonumber norelativenumber nolist' -c 'silent! %s/\e\[[0-9;?]*[a-zA-Z]//g' -c 'normal! G' -

# Tabs
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 4
tab_bar_margin_color #1b1d2b
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_title_template {index}: {title}

# Colors -- tokyonight moon (passend zu Neovim/Hyprland/waybar)
background #222436
foreground #c8d3f5
selection_background #2d3f76
selection_foreground #c8d3f5
url_color #4fd6be
cursor #c3e88d
cursor_text_color #222436

active_tab_background #82aaff
active_tab_foreground #1e2030
inactive_tab_background #2f334d
inactive_tab_foreground #545c7e
tab_bar_background #1b1d2b

active_border_color #82aaff
inactive_border_color #2f334d

color0  #1b1d2b
color1  #ff757f
color2  #c3e88d
color3  #ffc777
color4  #82aaff
color5  #c099ff
color6  #86e1fc
color7  #828bb8
color8  #444a73
color9  #ff8d94
color10 #c7fb6d
color11 #ffd8ab
color12 #9ab8ff
color13 #caabff
color14 #b2ebff
