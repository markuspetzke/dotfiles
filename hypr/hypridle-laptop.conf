# Laptop-Profil (hypr/scripts/run-hypridle.sh waehlt es ueber hypr-profile.sh).
# Waehrend Audio/Video laeuft, haelt media-watch.service eine Idle-Sperre: Dann loest keine
# Stufe aus, und nach dem Ende der Wiedergabe beginnt die Kette von vorn.
# Zuklappen regelt logind (hypr/logind/laptop.conf), nicht hypridle.

general {
    lock_cmd = pidof hyprlock || ~/.config/bin/theme-lock  # keine zweite Instanz; mit Theme-Sounds
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# 5 min: Bildschirm auf 10 % abdunkeln, Tastaturbeleuchtung aus (Vorwarnung, spart Akku)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/backlight.sh dim
    on-resume = ~/.config/hypr/scripts/backlight.sh restore
}

# 9 min: Bildschirmschoner des Themes (nur wenn das Theme einen hat), jede Aktivitaet beendet ihn
listener {
    timeout = 540
    # Schoner sperrt 60 s und schaltet 90 s nach seinem Start selbst ab (= 10 / 10,5 min)
    on-timeout = ~/.config/bin/screensaver start 60 90
    on-resume = ~/.config/bin/screensaver stop
}

# 10 min: sperren (vor DPMS, damit hyprlock einen echten Screenshot bekommt)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10,5 min: Monitore aus
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min auf Akku: Ruhezustand. Am Netzteil jede Minute neu pruefen (Abstecken waehrend
# des Leerlaufs schlaeft dann spaetestens eine Minute spaeter).
listener {
    timeout = 900
    condition_cmd = ~/.config/hypr/scripts/power-source.sh battery && ~/.config/hypr/scripts/sleep-allowed.sh
    condition_retry = 60
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh
}

# 60 min, auch am Netzteil: Ruhezustand wie am Desktop
listener {
    timeout = 3600
    condition_cmd = ~/.config/hypr/scripts/sleep-allowed.sh
    condition_retry = 300
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh
}
