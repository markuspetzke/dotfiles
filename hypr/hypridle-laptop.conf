# Laptop-Profil: Bildschirm nach 10 Minuten aus, Hibernate nach 15 Minuten.
$playing = playerctl -a status 2>/dev/null | grep -q Playing

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = $playing || hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900
    on-timeout = $playing || systemctl hibernate
}
