# Laptop profile (hypr/scripts/run-hypridle.sh picks it via hypr-profile.sh).
# While audio/video plays, media-watch.service holds an idle inhibitor: no stage fires,
# and once playback ends the chain starts over.
# The lid is handled by logind (hypr/logind/laptop.conf), not by hypridle.

general {
    lock_cmd = pidof hyprlock || ~/.config/bin/theme-lock  # no second instance; with theme sounds
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    inhibit_sleep = 3
}

# 5 min: dim the screen to 10 %, keyboard backlight off (early warning, saves battery)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/backlight.sh dim
    on-resume = ~/.config/hypr/scripts/backlight.sh restore
}

# 9 min: theme screensaver (only if the theme has one), any activity ends it
listener {
    timeout = 540
    # The screensaver locks after 60 s and turns the monitors off 90 s after it started (= 10 / 10.5 min)
    on-timeout = ~/.config/bin/screensaver start 60 90
    on-resume = ~/.config/bin/screensaver stop
}

# 10 min: lock (before DPMS, so hyprlock gets a real screenshot)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10.5 min: monitors off
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min on battery: sleep. On AC power check again every minute (unplugging while idle
# then sleeps at most a minute later).
listener {
    timeout = 900
    condition_cmd = ~/.config/hypr/scripts/power-source.sh battery && ~/.config/hypr/scripts/sleep-allowed.sh
    condition_retry = 60
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh
}

# 60 min, also on AC power: sleep like on the desktop
listener {
    timeout = 3600
    condition_cmd = ~/.config/hypr/scripts/sleep-allowed.sh
    condition_retry = 300
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh
}
