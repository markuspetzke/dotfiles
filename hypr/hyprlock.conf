# hyprlock -- tokyonight moon, gleiche Palette wie hypr/theme.lua
$font = FiraCode Nerd Font
$bg      = rgb(222436)
$fg      = rgb(c8d3f5)
$comment = rgb(636da6)
$blue    = rgb(82aaff)
$magenta = rgb(c099ff)
$green   = rgb(c3e88d)
$red     = rgb(ff757f)
$orange  = rgb(ff966c)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.15
}

# Uhr
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $fg
    position = 0, 160
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    font_size = 22
    font_family = $font
    color = $comment
    position = 0, 70
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgba(30, 32, 48, 0.85)
    outer_color = $blue $magenta 45deg
    check_color = $green
    fail_color = $red
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##636da6">󰌾  Passwort</span>
    fail_text = <span foreground="##ff757f">$PAMFAIL</span>

    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock / Layout-Hinweis
label {
    monitor =
    text = $LAYOUT
    font_size = 14
    font_family = $font
    color = $comment
    position = 0, -110
    halign = center
    valign = center
}

# Aktueller Titel (falls Musik laeuft)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 14
    font_family = $font
    color = $comment
    position = 0, 40
    halign = center
    valign = bottom
}
