# Laptop: closing the lid on battery suspends, on AC power it only locks.
# Docked (external monitor) it stays on; Hyprland then only turns off the internal
# display (hypr/monitors.lua).
# Install (takes effect after a reboot):
#   sudo install -Dm644 ~/.config/hypr/logind/laptop.conf /etc/systemd/logind.conf.d/90-hypr-laptop.conf
# If hibernation is set up, "suspend-then-hibernate" works instead of "suspend".
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
# Lid closed on battery always sleeps, even if a program blocks sleep
LidSwitchIgnoreInhibited=yes
