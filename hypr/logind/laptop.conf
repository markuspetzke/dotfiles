# Laptop: Zuklappen auf Akku schickt ihn schlafen (Suspend), am Netzteil wird nur gesperrt.
# Im Dock (externer Monitor) bleibt er an; Hyprland schaltet dann nur den internen
# Bildschirm ab (hypr/monitors.lua).
# Installieren (wirkt nach einem Neustart):
#   sudo install -Dm644 ~/.config/hypr/logind/laptop.conf /etc/systemd/logind.conf.d/90-hypr-laptop.conf
# Ist Hibernate eingerichtet, geht statt "suspend" auch "suspend-then-hibernate".
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
# Zugeklappt auf Akku immer schlafen, auch wenn ein Programm den Ruhezustand blockiert
LidSwitchIgnoreInhibited=yes
