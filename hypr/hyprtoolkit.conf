# hyprtoolkit-Theme (hyprlauncher und andere Hypr-Apps) -- tokyonight moon,
# gleiche Palette wie theme.lua / hyprlock.conf.

background       = rgba(1e2030f2)   # bg_dark, leicht transparent (Blur aus Hyprland)
base             = rgba(222436ff)   # bg: Eingabefeld, Listenflaechen
alternate_base   = rgba(2f334dff)   # bg_highlight: Hover / markierte Zeile
text             = rgba(c8d3f5ff)   # fg
bright_text      = rgba(ffffffff)
link_text        = rgba(86e1fcff)   # cyan
accent           = rgba(82aaffff)   # blue
accent_secondary = rgba(c099ffff)   # magenta

rounding_large = 12
rounding_small = 8

font_family           = FiraCode Nerd Font
font_family_monospace = FiraCode Nerd Font Mono
h1_size         = 18
h2_size         = 15
h3_size         = 13
small_font_size = 10

icon_theme = Adwaita
