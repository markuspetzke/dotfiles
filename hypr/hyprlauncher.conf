# hyprlauncher -- colors/font come from hyprtoolkit.conf.

general {
    grab_focus = true
}

cache {
    enabled = true   # frequently started apps come first
}

finders {
    default_finder = desktop
    desktop_icons = true
    # Start every app as its own systemd unit (like waybar/dunst): no inherited
    # limits, clean shutdown and logs per app.
    desktop_launch_prefix = uwsm-app --
    desktop_terminal = kitty

    # Prefixes: "=" calculator, "." unicode/emoji, "'" fonts
    math_prefix = =
    unicode_prefix = .
    font_prefix = '
}

ui {
    window_size = 520 400
}
