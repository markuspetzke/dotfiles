# hyprlauncher -- Farben/Schrift kommen aus hyprtoolkit.conf.

general {
    grab_focus = true
}

cache {
    enabled = true   # haeufig gestartete Apps stehen oben
}

finders {
    default_finder = desktop
    desktop_icons = true
    # Jede App als eigene systemd-Unit starten (wie waybar/dunst): kein Erben von
    # Limits, sauberes Beenden und Logs pro App.
    desktop_launch_prefix = uwsm app --
    desktop_terminal = kitty

    # Prefixe: "=" Rechner, "." Unicode/Emoji, "'" Schriftarten
    math_prefix = =
    unicode_prefix = .
    font_prefix = '
}

ui {
    window_size = 520 400
}
