# Desktop-Profil (hypr/scripts/run-hypridle.sh waehlt es ueber hypr-profile.sh).
# Waehrend Audio/Video laeuft, haelt media-watch.service eine Idle-Sperre: Dann loest keine
# Stufe aus, und nach dem Ende der Wiedergabe beginnt die Kette von vorn.

general {
    lock_cmd = pidof hyprlock || ~/.config/bin/theme-lock  # keine zweite Instanz; mit Theme-Sounds
    before_sleep_cmd = loginctl lock-session    # vor Suspend sperren
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # Bildschirm nach Suspend aktivieren
    ignore_dbus_inhibit = false                 # Browser/Player-Inhibits (Vollbild-Video) respektieren
    inhibit_sleep = 3                           # Suspend wartet, bis hyprlock wirklich gesperrt hat
}

# 9 min: Bildschirmschoner des Themes (nur wenn das Theme einen hat), jede Aktivitaet beendet ihn
listener {
    timeout = 540
    # Schoner sperrt 60 s und schaltet 90 s nach seinem Start selbst ab (= 10 / 10,5 min)
    on-timeout = ~/.config/bin/screensaver start 60 90
    on-resume = ~/.config/bin/screensaver stop
}

# 10 min: sperren (vor DPMS, damit hyprlock einen echten Screenshot bekommt)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10,5 min: Monitore aus
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 60 min: Suspend, ausser etwas blockiert den Ruhezustand (z. B. backup-hetzner); dann alle 5 min neu pruefen
listener {
    timeout = 3600
    condition_cmd = ~/.config/hypr/scripts/sleep-allowed.sh
    condition_retry = 300
    on-timeout = systemctl suspend
}
