# dunst -- Windows 3.1 (drop-in via dunst/dunstrc.d/50-theme.conf)
[global]
    frame_width = 3
    frame_color = "#000080"
    corner_radius = 0
    progress_bar_corner_radius = 0
    font = DepartureMono Nerd Font 8.25
    format = "<b>%s</b>\n%b"

[urgency_low]
    background = "#ffffff"
    foreground = "#606060"
    frame_color = "#808080"
[urgency_normal]
    background = "#c0c0c0"
    foreground = "#000000"
    frame_color = "#000080"
[urgency_critical]
    background = "#c0c0c0"
    foreground = "#000000"
    frame_color = "#a00000"

# Theme sound for every notification (bin/theme-sound filters low urgency)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
