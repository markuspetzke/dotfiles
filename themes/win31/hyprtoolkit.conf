# hyprtoolkit-Theme (hyprlauncher und andere Hypr-Apps) -- Windows-3.1,
# gleiche Palette wie theme.lua / hyprlock.conf.

background       = rgba(c0c0c0ff)   # bg (opak, Hyprland-Blur ist aus)
base             = rgba(ffffffff)   # bg_dark: Eingabefeld, Listenflaechen
alternate_base   = rgba(808080ff)   # surface2: Hover / markierte Zeile
text             = rgba(000000ff)   # fg
bright_text      = rgba(ffffffff)
link_text        = rgba(008080ff)   # teal
accent           = rgba(000080ff)   # accent
accent_secondary = rgba(008000ff)   # secondary

rounding_large = 0
rounding_small = 0

font_family           = DepartureMono Nerd Font
font_family_monospace = DepartureMono Nerd Font Mono
h1_size         = 16
h2_size         = 13
h3_size         = 11
small_font_size = 8

icon_theme = Adwaita
