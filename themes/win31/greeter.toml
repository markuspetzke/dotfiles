# Login screen (sysc-greet) -- Windows 3.1. `theme` copies the file to
# /var/lib/sysc-greet/themes/ and selects it (setup: bin/greeter-setup).
name = "win31"

[colors]
bg_base = "#008080"
bg_active = "#c0c0c0"
primary = "#ffffff"
secondary = "#c0c0c0"
accent = "#ffff55"
warning = "#ffff55"
danger = "#a00000"
fg_primary = "#ffffff"
fg_secondary = "#dfdfdf"
fg_muted = "#c0c0c0"
border_focus = "#000080"
