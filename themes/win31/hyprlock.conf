# hyprlock -- Windows-3.1 (eingebunden aus hypr/hyprlock.conf)
# Departure Mono ist auf 11px gerastert: Schriftgroessen als Vielfache von 11.
$font = DepartureMono Nerd Font
$bg      = rgb(c0c0c0)
$fg      = rgb(000000)
$muted   = rgb(606060)
$accent   = rgb(000080)
$olive   = rgb(008000)
$red     = rgb(a00000)

# Wallpaper abgedunkelt statt geblurter Screenshot (Pixel bleiben scharf)
background {
    monitor =
    path = ~/.local/state/theme/wallpaper.png
    blur_passes = 0
    brightness = 1.0
}

# Uhr und Datum weiss ueber dem Dialog
label {
    monitor =
    text = $TIME
    font_size = 99
    font_family = $font
    color = rgb(ffffff)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    font_size = 22
    font_family = $font
    color = rgb(ffffff)
    position = 0, 110
    halign = center
    valign = center
}

# Anmeldedialog: grauer Kasten mit schwarzem Rand ...
shape {
    monitor =
    size = 420, 200
    color = rgb(c0c0c0)
    rounding = 0
    border_size = 2
    border_color = rgb(000000)
    position = 0, -40
    halign = center
    valign = center
}

# ... und Navy-Titelleiste
shape {
    monitor =
    size = 416, 26
    color = $accent
    rounding = 0
    position = 0, 46
    halign = center
    valign = center
}

label {
    monitor =
    text = Anmelden
    font_size = 11
    font_family = $font
    color = rgb(ffffff)
    position = 0, 46
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "Benutzer: $USER"
    font_size = 11
    font_family = $font
    color = rgb(000000)
    position = 0, 5
    halign = center
    valign = center
}

# Passwortfeld: weisses, eingelassenes Eingabefeld
input-field {
    monitor =
    size = 300, 30
    outline_thickness = 2
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_text_format = *

    inner_color = rgb(ffffff)
    outer_color = rgb(808080)
    check_color = $accent
    fail_color = $red
    font_color = rgb(000000)
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##808080">Passwort</span>
    fail_text = <span foreground="##a00000">$PAMFAIL</span>

    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock / Layout-Hinweis und "Knopf"-Hinweis
label {
    monitor =
    text = $LAYOUT
    font_size = 11
    font_family = $font
    color = rgb(404040)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = [ Eingabe = OK ]
    font_size = 11
    font_family = $font
    color = rgb(000000)
    position = 0, -112
    halign = center
    valign = center
}

# Aktueller Titel (falls Musik laeuft)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 11
    font_family = $font
    color = rgb(dfdfdf)
    position = 0, 40
    halign = center
    valign = bottom
}
