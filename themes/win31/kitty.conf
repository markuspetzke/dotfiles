# Kitty -- Windows 3.1: cursor and colors (included at the end of kitty/kitty.conf)
cursor_shape underline
cursor_blink_interval 0.5
tab_bar_margin_color #000000

# Colors -- Windows 3.1
background #000000
foreground #c0c0c0
selection_background #0000aa
selection_foreground #ffffff
url_color #00aaaa
cursor #ffff55
cursor_text_color #000000

active_tab_background #ffff55
active_tab_foreground #000000
inactive_tab_background #1c1c1c
inactive_tab_foreground #808080
tab_bar_background #000000

active_border_color #ffff55
inactive_border_color #2e2e2e

# 16 colors: warm and muted, yellow = navy
color0  #000000
color1  #aa0000
color2  #00aa00
color3  #ffff55
color4  #0000aa
color5  #aa00aa
color6  #00aaaa
color7  #aaaaaa
color8  #555555
color9  #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff

# No background image (otherwise the one from wired would stay active after a switch)
background_image none

# No cursor trail (only retro has one)
cursor_trail 0
