# dunst -- Windows XP: notifications as a yellow balloon from the notification area
[global]
    frame_width = 1
    frame_color = "#000000"
    corner_radius = 8
    progress_bar_corner_radius = 3
    font = Noto Sans 10
    format = "<b>%s</b>\n%b"
    # like XP balloons: bottom right above the notification area
    origin = bottom-right
    offset = (14, 44)

[urgency_low]
    background = "#ffffe1"
    foreground = "#404040"
    frame_color = "#7a7a7a"
[urgency_normal]
    background = "#ffffe1"
    foreground = "#000000"
    frame_color = "#000000"
[urgency_critical]
    background = "#ffffe1"
    foreground = "#000000"
    frame_color = "#e04343"

# Theme sound for every notification (bin/theme-sound filters low urgency)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
