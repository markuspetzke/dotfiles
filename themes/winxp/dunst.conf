# dunst -- Windows XP: Benachrichtigungen als gelbe Sprechblase aus dem Infobereich
[global]
    frame_width = 1
    frame_color = "#000000"
    corner_radius = 8
    progress_bar_corner_radius = 3
    font = Noto Sans 10
    format = "<b>%s</b>\n%b"
    # wie XP-Sprechblasen: unten rechts ueber dem Infobereich
    origin = bottom-right
    offset = (14, 44)

[urgency_low]
    background = "#ffffe1"
    foreground = "#404040"
    frame_color = "#7a7a7a"
[urgency_normal]
    background = "#ffffe1"
    foreground = "#000000"
    frame_color = "#000000"
[urgency_critical]
    background = "#ffffe1"
    foreground = "#000000"
    frame_color = "#e04343"

# Sound des Themes bei jeder Benachrichtigung (bin/theme-sound filtert niedrige Dringlichkeit)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
