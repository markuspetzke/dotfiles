# hyprlock -- Windows XP (eingebunden aus hypr/hyprlock.conf): Willkommensbildschirm
$font    = Noto Sans
$white   = rgb(ffffff)
$light   = rgb(c3d3fd)
$accent  = rgb(0054e3)
$green   = rgb(3c9a3c)
$red     = rgb(e04343)

# Hintergrund: Luna-Blau
background {
    monitor =
    color = rgb(5a7edc)
}

# Dunkelblaue Balken oben und unten mit heller Kante
shape {
    monitor =
    size = 100%, 90
    color = rgb(00309c)
    rounding = 0
    position = 0, 0
    halign = center
    valign = top
}

shape {
    monitor =
    size = 100%, 2
    color = rgb(8fb2f5)
    rounding = 0
    position = 0, -90
    halign = center
    valign = top
}

shape {
    monitor =
    size = 100%, 110
    color = rgb(00309c)
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 100%, 2
    color = rgb(f0a050)
    rounding = 0
    position = 0, 110
    halign = center
    valign = bottom
}

# Trennlinie in der Mitte
shape {
    monitor =
    size = 2, 420
    color = rgba(ffffff99)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# Links: Begruessung (wie XP: kleingeschriebenes "welcome")
label {
    monitor =
    text = welcome
    font_size = 54
    font_family = $font Bold Italic
    color = $white
    position = -330, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = To begin, type your password
    font_size = 15
    font_family = $font
    color = $light
    position = -330, -30
    halign = center
    valign = center
}

# Rechts: Benutzerkachel
shape {
    monitor =
    size = 64, 64
    color = rgb(f0a050)
    rounding = 6
    border_size = 2
    border_color = $white
    position = 120, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER"
    font_size = 20
    font_family = $font
    color = $white
    position = 270, 52
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 230, 30
    outline_thickness = 1
    rounding = 3
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = false
    dots_text_format = *

    inner_color = rgb(ffffff)
    outer_color = rgb(3a6ea5)
    check_color = $green
    fail_color = $red
    font_color = rgb(000000)
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##808080">Password</span>
    fail_text = <span foreground="##e04343">$PAMFAIL</span>

    position = 285, 15
    halign = center
    valign = center
}

# Uhr und Datum unten links im Balken
label {
    monitor =
    text = $TIME
    font_size = 20
    font_family = $font
    color = $white
    position = 40, 40
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %B %d, %Y"
    font_size = 11
    font_family = $font
    color = $light
    position = 40, 18
    halign = left
    valign = bottom
}

# Caps Lock / Layout-Hinweis
label {
    monitor =
    text = $LAYOUT
    font_size = 11
    font_family = $font
    color = $light
    position = 285, -25
    halign = center
    valign = center
}

# Aktueller Titel (falls Musik laeuft)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 11
    font_family = $font
    color = $light
    position = -40, 40
    halign = right
    valign = bottom
}

# Eigenes Logo, falls themes/winxp/private/logo.png existiert (Datei erzeugt bin/theme)
source = ~/.local/state/theme/hyprlock-extra.conf
