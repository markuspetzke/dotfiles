# dunst -- Office (Dunder Mifflin): Benachrichtigungen als Memo (Drop-in ueber dunst/dunstrc.d/50-theme.conf)
[global]
    frame_width = 1
    frame_color = "#3d4450"
    corner_radius = 4
    progress_bar_corner_radius = 2
    font = Noto Sans 10
    format = "<b>MEMO</b> · Dunder Mifflin Scranton · %a\n<b>Betreff:</b> %s\n%b"

[urgency_low]
    background = "#181b20"
    foreground = "#8d8778"
    frame_color = "#3d4450"
[urgency_normal]
    background = "#2a2f37"
    foreground = "#e6dfcf"
    frame_color = "#5b8ad0"
[urgency_critical]
    background = "#2a2f37"
    foreground = "#e6dfcf"
    frame_color = "#d0574a"

# Sound des Themes bei jeder Benachrichtigung (bin/theme-sound filtert niedrige Dringlichkeit)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
