# hyprlock -- Office (eingebunden aus hypr/hyprlock.conf): Stempeluhr / Zeiterfassung
$font    = Noto Sans
$bg      = rgb(1f2329)
$fg      = rgb(e6dfcf)
$muted   = rgb(8d8778)
$accent  = rgb(5b8ad0)
$green   = rgb(7fae5b)
$red     = rgb(d0574a)

background {
    monitor =
    path = ~/.local/state/theme/wallpaper.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.5
}

# Stempelkarte: weisses Feld mit blauer Kopfzeile
shape {
    monitor =
    size = 440, 300
    color = rgba(2a2f37f5)
    rounding = 6
    border_size = 1
    border_color = rgb(3d4450)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 440, 40
    color = $accent
    rounding = 6
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = DUNDER MIFFLIN · ZEITERFASSUNG
    font_size = 14
    font_family = $font Bold
    color = rgb(ffffff)
    position = 0, 130
    halign = center
    valign = center
}

# Uhr
label {
    monitor =
    text = $TIME
    font_size = 56
    font_family = $font
    color = $fg
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    font_size = 13
    font_family = $font
    color = $muted
    position = 0, 8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgb(1f2329)
    outer_color = $accent
    check_color = $green
    fail_color = $red
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##8d8778">Passwort zum Einstempeln</span>
    fail_text = <span foreground="##d0574a">$PAMFAIL</span>

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "Mitarbeiter: $USER · Filiale Scranton"
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, -105
    halign = center
    valign = center
}

# Zitat des Tages
label {
    monitor =
    text = cmd[update:60000] shuf -n1 ~/.config/themes/office/quotes.txt
    font_size = 12
    font_family = $font Italic
    color = $muted
    position = 0, -180
    halign = center
    valign = center
}

# Caps Lock / Layout-Hinweis
label {
    monitor =
    text = $LAYOUT
    font_size = 11
    font_family = $font
    color = $fg
    position = 0, -215
    halign = center
    valign = center
}

# Aktueller Titel (falls Musik laeuft)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 11
    font_family = $font
    color = $fg
    position = 0, 40
    halign = center
    valign = bottom
}

# Eigenes Logo, falls themes/office/private/logo.png existiert (Datei erzeugt bin/theme)
source = ~/.local/state/theme/hyprlock-extra.conf
