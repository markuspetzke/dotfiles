# hyprtoolkit theme (hyprlauncher and other Hypr apps) -- Wired,
# same palette as theme.lua / hyprlock.conf.

background       = rgba(0c0e0cff)   # bg (opaque, Hyprland blur is off)
base             = rgba(070807ff)   # bg_dark: entry field, list areas
alternate_base   = rgba(232a23ff)   # surface2: hover / selected row
text             = rgba(c9d6c3ff)   # fg
bright_text      = rgba(e8f2e2ff)
link_text        = rgba(6fb3c8ff)   # teal
accent           = rgba(7fd88fff)   # accent
accent_secondary = rgba(9d84d8ff)   # secondary

rounding_large = 0
rounding_small = 0

font_family           = DepartureMono Nerd Font
font_family_monospace = DepartureMono Nerd Font Mono
h1_size         = 16
h2_size         = 13
h3_size         = 11
small_font_size = 8

icon_theme = Adwaita
