# Kitty -- Wired: cursor and colors (included at the end of kitty/kitty.conf)
cursor_shape block
cursor_blink_interval 0.6
tab_bar_margin_color #070807

# Colors -- Wired
background #0c0e0c
foreground #c9d6c3
selection_background #1f3a26
selection_foreground #e8f2e2
url_color #6fb3c8
cursor #7fd88f
cursor_text_color #0c0e0c

active_tab_background #7fd88f
active_tab_foreground #070807
inactive_tab_background #161a16
inactive_tab_foreground #6f7d6b
tab_bar_background #070807

active_border_color #7fd88f
inactive_border_color #232a23

# 16 colors: warm and muted, yellow = phosphor green
color0  #070807
color1  #d8607a
color2  #9d84d8
color3  #7fd88f
color4  #5f8fb3
color5  #8f78c8
color6  #6fb3c8
color7  #a9b8a3
color8  #2f382f
color9  #e87890
color10 #c8e070
color11 #a3f0b0
color12 #6fb3c8
color13 #b39de8
color14 #7cd0d0
color15 #e8f2e2

# Light scanline texture (1x3 px, every 3rd line darker) behind the text
background_image ~/.config/theme-current/kitty-scanlines.png
background_image_layout tiled
background_tint 0

# No cursor trail (only retro has one)
cursor_trail 0
