# dunst -- Wired (Drop-in ueber dunst/dunstrc.d/50-theme.conf)
[global]
    frame_width = 2
    frame_color = "#7fd88f"
    corner_radius = 0
    progress_bar_corner_radius = 0
    font = DepartureMono Nerd Font 8.25
    format = "<b>INCOMING</b> // %a\n<b>&gt; %s</b>\n%b"
    # oben links statt oben rechts
    origin = top-left
    offset = (16, 16)

[urgency_low]
    background = "#070807"
    foreground = "#6f7d6b"
    frame_color = "#232a23"
[urgency_normal]
    background = "#0c0e0c"
    foreground = "#c9d6c3"
    frame_color = "#7fd88f"
[urgency_critical]
    background = "#0c0e0c"
    foreground = "#c9d6c3"
    frame_color = "#d8607a"

# Sound des Themes bei jeder Benachrichtigung (bin/theme-sound filtert niedrige Dringlichkeit)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
