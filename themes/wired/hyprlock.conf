# hyprlock -- Wired (included from hypr/hyprlock.conf)
# Departure Mono is rasterized at 11px: font sizes as multiples of 11.
$font = DepartureMono Nerd Font
$bg      = rgb(0c0e0c)
$fg      = rgb(c9d6c3)
$muted   = rgb(6f7d6b)
$accent   = rgb(7fd88f)
$olive   = rgb(9d84d8)
$red     = rgb(d8607a)

# Wallpaper darkened instead of a blurred screenshot (pixels stay sharp)
background {
    monitor =
    path = ~/.local/state/theme/wallpaper.png
    blur_passes = 0
    brightness = 0.55
}

# Header
label {
    monitor =
    text = PRESENT DAY, PRESENT TIME
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, 250
    halign = center
    valign = center
}

# Clock with seconds
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    font_size = 99
    font_family = $font
    color = $accent
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%Y-%m-%d  %A"
    font_size = 22
    font_family = $font
    color = $olive
    position = 0, 70
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 330, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_text_format = *

    inner_color = $bg
    outer_color = $accent
    check_color = $olive
    fail_color = $red
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##6f7d6b">&gt; connect_</span>
    fail_text = <span foreground="##d8607a">$PAMFAIL</span>

    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock / layout hint
label {
    monitor =
    text = $LAYOUT
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, -110
    halign = center
    valign = center
}

# Current track (if music is playing)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, 40
    halign = center
    valign = bottom
}
