# dunst -- Amber CRT (drop-in via dunst/dunstrc.d/50-theme.conf)
[global]
    frame_width = 2
    frame_color = "#e8a33d"
    corner_radius = 0
    progress_bar_corner_radius = 0
    font = DepartureMono Nerd Font 8.25
    format = "<b>** %s **</b>\n%b"

[urgency_low]
    background = "#141310"
    foreground = "#8a8370"
    frame_color = "#36332b"
[urgency_normal]
    background = "#1b1a16"
    foreground = "#e6dcc3"
    frame_color = "#e8a33d"
[urgency_critical]
    background = "#1b1a16"
    foreground = "#e6dcc3"
    frame_color = "#c8553d"

# Theme sound for every notification (bin/theme-sound filters low urgency)
[theme_sound]
    summary = "*"
    script = ~/.config/bin/theme-sound
