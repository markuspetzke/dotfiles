# hyprtoolkit theme (hyprlauncher and other Hypr apps) -- Amber CRT,
# same palette as theme.lua / hyprlock.conf.

background       = rgba(1b1a16ff)   # bg (opaque, Hyprland blur is off)
base             = rgba(141310ff)   # bg_dark: entry field, list areas
alternate_base   = rgba(36332bff)   # surface2: hover / selected row
text             = rgba(e6dcc3ff)   # fg
bright_text      = rgba(f4ecd8ff)
link_text        = rgba(5fa8a3ff)   # teal
accent           = rgba(e8a33dff)   # amber
accent_secondary = rgba(8f9a5bff)   # olive

rounding_large = 0
rounding_small = 0

font_family           = DepartureMono Nerd Font
font_family_monospace = DepartureMono Nerd Font Mono
h1_size         = 16
h2_size         = 13
h3_size         = 11
small_font_size = 8

icon_theme = Adwaita
