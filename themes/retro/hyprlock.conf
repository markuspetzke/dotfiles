# hyprlock -- Bernstein-CRT (eingebunden aus hypr/hyprlock.conf)
# Departure Mono ist auf 11px gerastert: Schriftgroessen als Vielfache von 11.
$font = DepartureMono Nerd Font
$bg      = rgb(1b1a16)
$fg      = rgb(e6dcc3)
$muted   = rgb(8a8370)
$amber   = rgb(e8a33d)
$olive   = rgb(8f9a5b)
$red     = rgb(c8553d)

# Wallpaper abgedunkelt statt geblurter Screenshot (Pixel bleiben scharf)
background {
    monitor =
    path = ~/.config/theme-current/wallpaper.png
    blur_passes = 0
    brightness = 0.55
}

# Uhr
label {
    monitor =
    text = $TIME
    font_size = 99
    font_family = $font
    color = $amber
    position = 0, 160
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    font_size = 22
    font_family = $font
    color = $fg
    position = 0, 70
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor =
    size = 330, 44
    outline_thickness = 2
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = $bg
    outer_color = $amber
    check_color = $olive
    fail_color = $red
    font_color = $fg
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="##8a8370">&gt; PASSWORT_</span>
    fail_text = <span foreground="##c8553d">$PAMFAIL</span>

    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock / Layout-Hinweis
label {
    monitor =
    text = $LAYOUT
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, -110
    halign = center
    valign = center
}

# Aktueller Titel (falls Musik laeuft)
label {
    monitor =
    text = cmd[update:2000] bash ~/.config/hypr/scripts/lock-media.sh
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, 40
    halign = center
    valign = bottom
}
