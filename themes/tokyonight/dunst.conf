# dunst -- Tokyo Night (Drop-in ueber dunst/dunstrc.d/50-theme.conf)
[global]
    frame_width = 2
    frame_color = "#82aaff"
    corner_radius = 8
    progress_bar_corner_radius = 4
    font = FiraCode Nerd Font 10
    format = "<b>%s</b>\n%b"

[urgency_low]
    background = "#1e2030"
    foreground = "#828bb8"
    frame_color = "#636da6"
[urgency_normal]
    background = "#222436"
    foreground = "#c8d3f5"
    frame_color = "#82aaff"
[urgency_critical]
    background = "#222436"
    foreground = "#c8d3f5"
    frame_color = "#ff757f"
