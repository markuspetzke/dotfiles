# Login screen (sysc-greet) -- Tokyo Night. `theme` copies the file to
# /var/lib/sysc-greet/themes/ and selects it (setup: bin/greeter-setup).
name = "tokyonight"

[colors]
bg_base = "#222436"
bg_active = "#2f334d"
primary = "#82aaff"
secondary = "#c099ff"
accent = "#86e1fc"
warning = "#ffc777"
danger = "#ff757f"
fg_primary = "#c8d3f5"
fg_secondary = "#a9b8e8"
fg_muted = "#636da6"
border_focus = "#82aaff"
